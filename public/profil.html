<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio & Profil Resmi Studio</title>
    <link rel="icon" type="image/svg+xml" href="/logo-kafela.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* ==========================================================================
           3 TEMA BUKU PORTOFOLIO INTERAKTIF 5 BAB (T-AMOUR ARCHITECTURE)
           1. MODERN_STUDIO    -> Amour Ivory & Rose Gold (Krem Hangat & Dusty Rose)
           2. LUXURY_GOLD      -> Royal Obsidian & Gold (Hitam Pekat & Emas Eksklusif)
           3. CLEAN_MINIMALIST -> Botanical White & Sage (Putih Bersih & Hijau Sage)
           ========================================================================== */
        :root,
        body[data-theme="MODERN_STUDIO"] {
            --am-bg: #fbf8f6;
            --am-paper: #ffffff;
            --am-nav-bg: rgba(251, 248, 246, 0.9);
            --am-ink: #2c2225;
            --am-muted: #7d6b70;
            --am-accent: #c88a94;
            --am-gold: #b89146;
            --am-line: #eadfe2;
            --am-btn-bg: #2c2225;
            --am-btn-text: #ffffff;
            --am-shadow: 0 18px 42px rgba(44, 34, 37, 0.06);
        }

        body[data-theme="LUXURY_GOLD"] {
            --am-bg: #0c0b0e;
            --am-paper: #16141a;
            --am-nav-bg: rgba(12, 11, 14, 0.9);
            --am-ink: #f7f3eb;
            --am-muted: #a69f95;
            --am-accent: #d4af37;
            --am-gold: #e5c158;
            --am-line: #2e281d;
            --am-btn-bg: #d4af37;
            --am-btn-text: #0c0b0e;
            --am-shadow: 0 22px 50px rgba(0, 0, 0, 0.65);
        }

        body[data-theme="CLEAN_MINIMALIST"] {
            --am-bg: #f6f8f7;
            --am-paper: #ffffff;
            --am-nav-bg: rgba(255, 255, 255, 0.92);
            --am-ink: #132a23;
            --am-muted: #5c726a;
            --am-accent: #2e6f5b;
            --am-gold: #2e6f5b;
            --am-line: #dce5e1;
            --am-btn-bg: #132a23;
            --am-btn-text: #ffffff;
            --am-shadow: 0 18px 40px rgba(19, 42, 35, 0.06);
        }

        .t-amour {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--am-bg);
            color: var(--am-ink);
        }

        /* TOP NAVBAR BUKU */
        .am-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            z-index: 60;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            background: var(--am-nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--am-line);
        }

        .am-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--am-ink);
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 21px;
            font-weight: 700;
            cursor: pointer;
        }

        .am-brand-logo {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid var(--am-gold);
            display: none;
        }

        .am-nav-links {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .am-nav-link {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--am-muted);
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }

        .am-nav-link:hover,
        .am-nav-link.active {
            color: var(--am-gold);
            font-weight: 700;
        }

        .am-nav-book-btn {
            padding: 9px 18px;
            border-radius: 99px;
            background: var(--am-btn-bg);
            color: var(--am-btn-text);
            font-size: 12.5px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .am-nav-book-btn:hover {
            opacity: 0.9;
        }

        /* HORIZONTAL BOOK CONTAINER */
        .book {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            scrollbar-width: none;
        }

        .book::-webkit-scrollbar {
            display: none;
        }

        .page {
            flex: 0 0 100vw;
            width: 100vw;
            height: 100vh;
            scroll-snap-align: start;
            overflow-y: auto;
            position: relative;
            padding: 90px 24px 104px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .page-in {
            width: 100%;
            max-width: 1060px;
            margin: auto;
        }

        /* ==========================================================================
           BAB 0: SAMPUL BUKU (MENGGUNAKAN FOTO 1 SEBAGAI BACKGROUND COVER)
           ========================================================================== */
        .page.cover {
            padding: 0;
            align-items: center;
            justify-content: center;
            background: #141012;
            color: #ffffff;
        }

        .cover-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            opacity: 0.62;
        }

        .cover-in {
            position: relative;
            z-index: 2;
            padding: 24px;
            display: flex;
            justify-content: center;
        }

        .cover-frame {
            width: 100%;
            max-width: 640px;
            background: rgba(20, 16, 18, 0.68);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            outline: 1px solid rgba(255, 255, 255, 0.14);
            outline-offset: -10px;
            border-radius: 26px;
            padding: 52px 36px;
            text-align: center;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55);
        }

        .cover-eyebrow {
            font-size: 11.5px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #f3d7de;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .cover-orn {
            font-size: 24px;
            color: #e5c158;
            margin-bottom: 10px;
        }

        .cover-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(34px, 5vw, 56px);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .cover-script {
            font-family: 'Great Vibes', cursive;
            font-size: 31px;
            color: #f3d7de;
            margin-bottom: 8px;
        }

        .cover-tag {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.85);
            max-width: 480px;
            margin: 0 auto 28px;
            line-height: 1.65;
        }

        .btn-cover {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 13px 30px;
            border-radius: 99px;
            background: #ffffff;
            color: #1c1618;
            font-size: 13.5px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: transform 0.2s;
        }

        .btn-cover:hover {
            transform: translateY(-2px);
        }

        /* HEADER SETIAP BAB BUKU */
        .page-head {
            text-align: center;
            margin-bottom: 34px;
        }

        .chapter {
            display: block;
            font-size: 11.5px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--am-accent);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .page-head .title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(32px, 4vw, 44px);
            font-weight: 600;
            color: var(--am-ink);
        }

        .page-head .title em {
            font-style: italic;
            color: var(--am-gold);
        }

        /* ==========================================================================
           BAB I: MENGENAI KAMI (TANPA FOTO KARYA — FOKUS BIO, LOGO, CABANG & SOSMED)
           ========================================================================== */
        .about-editorial-card {
            background: var(--am-paper);
            border: 1px solid var(--am-line);
            border-radius: 26px;
            padding: 46px 40px;
            max-width: 820px;
            margin: 0 auto;
            box-shadow: var(--am-shadow);
            text-align: center;
        }

        .about-logo-circle {
            width: 108px;
            height: 108px;
            border-radius: 50%;
            margin: 0 auto 22px;
            padding: 4px;
            border: 2px solid var(--am-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: var(--am-bg);
        }

        .about-logo-circle img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: none;
        }

        .about-logo-initial {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 42px;
            font-weight: 700;
            color: var(--am-gold);
        }

        .dropcap {
            font-size: 16.5px;
            line-height: 1.85;
            color: var(--am-ink);
            margin: 0 auto 24px;
            max-width: 640px;
            text-align: left;
            white-space: pre-line;
        }

        .dropcap::first-letter {
            font-family: 'Cormorant Garamond', Georgia, serif;
            float: left;
            font-size: 58px;
            line-height: 0.85;
            padding-right: 12px;
            padding-top: 4px;
            color: var(--am-gold);
            font-weight: 700;
        }

        .sign {
            font-family: 'Great Vibes', cursive;
            font-size: 34px;
            color: var(--am-accent);
            margin-bottom: 24px;
        }

        .branch-badges-wrap {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .address-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--am-bg);
            border: 1px solid var(--am-line);
            padding: 9px 18px;
            border-radius: 99px;
            font-size: 13px;
            font-weight: 600;
            color: var(--am-ink);
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .address-badge:hover {
            transform: translateY(-2px);
            border-color: var(--am-gold);
        }

        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .social-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 99px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 13px;
            transition: transform 0.2s;
        }

        .social-btn:hover {
            transform: translateY(-2px);
        }

        .btn-ig {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }

        .btn-tiktok {
            background: #141418;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* ==========================================================================
           BAB II: DAFTAR LAYANAN (KATALOG BERNOMOR 01, 02, 03...)
           ========================================================================== */
        .svc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 20px;
        }

        .svc-item {
            background: var(--am-paper);
            border: 1px solid var(--am-line);
            border-radius: 20px;
            padding: 26px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--am-shadow);
            transition: transform 0.2s, border-color 0.2s;
        }

        .svc-item:hover {
            transform: translateY(-4px);
            border-color: var(--am-gold);
        }

        .svc-no {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--am-accent);
            letter-spacing: 0.1em;
            margin-bottom: 6px;
        }

        .svc-name {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--am-ink);
            margin-bottom: 6px;
        }

        .svc-price {
            font-size: 19px;
            font-weight: 800;
            color: var(--am-gold);
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px dashed var(--am-line);
        }

        .svc-desc {
            font-size: 13.5px;
            color: var(--am-muted);
            line-height: 1.65;
            white-space: pre-line;
            margin-bottom: 18px;
        }

        .svc-btn {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            background: var(--am-btn-bg);
            color: var(--am-btn-text);
            font-size: 13px;
            font-weight: 800;
            border: none;
            cursor: pointer;
        }

        /* ==========================================================================
           BAB III: HALAMAN GALERI KARYA (1 FOTO RAKSASA DI ATAS + GRID FOTO BERNAMA)
           ========================================================================== */
        .featured-karya-hero {
            position: relative;
            width: 100%;
            height: 490px;
            border-radius: 24px;
            overflow: hidden;
            background: #141012;
            border: 1.5px solid var(--am-line);
            box-shadow: var(--am-shadow);
            margin-bottom: 24px;
            cursor: zoom-in;
        }

        .featured-karya-hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            display: block;
            transition: transform 0.4s ease;
        }

        .featured-karya-hero:hover img {
            transform: scale(1.02);
        }

        .featured-karya-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 36px 24px 20px;
            background: linear-gradient(to top, rgba(12, 10, 12, 0.9) 0%, rgba(12, 10, 12, 0.45) 60%, transparent 100%);
            color: #ffffff;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: space-between;
            gap: 12px;
        }

        .featured-karya-badge {
            display: inline-block;
            font-size: 10.5px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: #e5c158;
            margin-bottom: 4px;
        }

        .featured-karya-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(24px, 3.2vw, 34px);
            font-weight: 700;
            color: #ffffff;
            line-height: 1.15;
        }

        .featured-zoom-pill {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 700;
        }

        .gal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
            gap: 18px;
        }

        figure.gal {
            background: var(--am-paper);
            border: 1.5px solid var(--am-line);
            border-radius: 18px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: var(--am-shadow);
            transition: transform 0.25s ease, border-color 0.25s ease;
        }

        figure.gal:hover,
        figure.gal.active-thumb {
            transform: translateY(-4px);
            border-color: var(--am-gold);
        }

        figure.gal img {
            width: 100%;
            height: 290px;
            object-fit: cover;
            object-position: center center;
            display: block;
        }

        figure.gal figcaption {
            padding: 13px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .g-name {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--am-ink);
            line-height: 1.25;
        }

        .g-tag {
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--am-accent);
            font-weight: 700;
            flex-shrink: 0;
        }

        /* ==========================================================================
           BAB IV: MARI BERJUMPA & PENUTUP
           ========================================================================== */
        .closing-card {
            background: var(--am-paper);
            border: 1px solid var(--am-line);
            border-radius: 26px;
            padding: 48px 32px;
            text-align: center;
            max-width: 720px;
            margin: 0 auto;
            box-shadow: var(--am-shadow);
        }

        .thanks {
            font-family: 'Great Vibes', cursive;
            font-size: 46px;
            color: var(--am-gold);
            margin-bottom: 8px;
        }

        .b-brand {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--am-ink);
            margin-bottom: 10px;
        }

        .b-tagline {
            font-size: 14.5px;
            color: var(--am-muted);
            max-width: 540px;
            margin: 0 auto 22px;
            line-height: 1.65;
        }

        /* DOTS & HINT BUKU AMOUR */
        .dots {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 65;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(24, 19, 21, 0.84);
            backdrop-filter: blur(10px);
            padding: 10px 18px;
            border-radius: 99px;
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.35);
            cursor: pointer;
            transition: all 0.25s;
        }

        .dot.on {
            width: 26px;
            border-radius: 99px;
            background: #e5c158;
        }

        .hint {
            position: fixed;
            bottom: 22px;
            right: 24px;
            z-index: 65;
            background: rgba(24, 19, 21, 0.84);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.06em;
            cursor: pointer;
            transition: opacity 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        .hint.hide {
            opacity: 0;
            pointer-events: none;
        }

        /* MODAL LIGHTBOX FULLSCREEN HD */
        .lightbox-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(5, 8, 15, 0.94);
            backdrop-filter: blur(12px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .lightbox-modal.open {
            display: flex;
        }

        .lightbox-img {
            max-width: 92vw;
            max-height: 82vh;
            object-fit: contain;
            border-radius: 14px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75);
        }

        .lightbox-caption {
            margin-top: 14px;
            color: #ffffff;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 24px;
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 9px 18px;
            border-radius: 99px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .am-nav { padding: 0 16px; }
            .am-nav-links { display: none; }
            .page { padding: 80px 16px 96px; }
            .about-editorial-card { padding: 32px 22px; }
            .featured-karya-hero { height: 340px; border-radius: 18px; }
            figure.gal img { height: 240px; }
            .cover-frame { padding: 38px 22px; }
        }
    </style>
</head>
<body data-theme="MODERN_STUDIO">

    <div class="t-amour">
        <!-- NAVBAR ATAS (4 HALAMAN: SAMPUL, GALERI KARYA, LAYANAN, KONTAK) -->
        <nav class="am-nav">
            <a class="am-brand" onclick="goToBookPage(0)">
                <img id="amLogoImg" class="am-brand-logo" src="/logo-kafela.svg" alt="Logo" style="display: block;">
                <span class="js-nama-brand">Memuat Studio...</span>
            </a>
            <div class="am-nav-links">
                <a class="am-nav-link active" onclick="goToBookPage(0)">Sampul</a>
                <a class="am-nav-link" onclick="goToBookPage(1)">Galeri Karya</a>
                <a class="am-nav-link" onclick="goToBookPage(2)">Layanan</a>
                <a class="am-nav-link" onclick="goToBookPage(3)">Kontak</a>
            </div>
            <button type="button" class="am-nav-book-btn" onclick="bukaFormBooking('', '')">Booking Online &rarr;</button>
        </nav>

        <!-- BUKU GESER SAMPING 4 HALAMAN -->
        <div class="book" id="amourBookContainer">

            <!-- HALAMAN 1: LANDING UTAMA (FOTO 1 BACKGROUND + TEKS MINIMALIS SESUAI YANG DISIMPAN KLIEN + SLOGAN + BIO + IG & TIKTOK) -->
            <section class="page cover active">
                <img id="amCoverBg" class="cover-bg" src="" alt="Sampul Studio">
                <div class="page-in cover-in">
                    <div class="cover-frame">
                        <div style="width: 78px; height: 78px; border-radius: 50%; overflow: hidden; margin: 0 auto 14px; border: 2px solid rgba(255,255,255,0.65); background: #ffffff; box-shadow: 0 8px 24px rgba(0,0,0,0.28);">
                            <img id="coverLogoImg" src="/logo-kafela.svg" alt="Logo Studio" style="width: 100%; height: 100%; object-fit: cover; display: block;">
                        </div>
                        <p id="coverJenisEl" class="cover-eyebrow js-jenis-usaha" style="display: none;"></p>
                        <h1 class="cover-title js-nama-brand" style="margin-bottom: 10px;"></h1>
                        <p id="coverTaglineEl" style="display: none; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: clamp(19px, 2.4vw, 25px); color: #f6e3ba; margin: 0 auto 12px; max-width: 600px; line-height: 1.35;"></p>
                        <p id="coverBioEl" style="display: none; font-size: 13.5px; color: rgba(255,255,255,0.9); max-width: 560px; margin: 0 auto 20px; line-height: 1.65; white-space: pre-line;"></p>

                        <!-- TOMBOL BERLOGO INSTAGRAM & TIKTOK LANGSUNG DI HALAMAN AWAL -->
                        <div class="social-buttons js-block-sosmed" style="display: none; margin-bottom: 22px;"></div>

                        <button type="button" class="btn-cover" onclick="goToBookPage(1)">Lihat Galeri Karya &rarr;</button>
                    </div>
                </div>
            </section>

            <!-- HALAMAN 2 (BAB I): GALERI KARYA (DITUKAR MAJU KE HALAMAN 2 SETELAH LANDING) -->
            <section class="page">
                <div class="page-in">
                    <div class="page-head">
                        <span class="chapter">Bab I</span>
                        <h2 class="title">Galeri <em>Karya</em></h2>
                    </div>

                    <!-- 1 FOTO UTAMA BESAR DI ATAS HALAMAN KARYA -->
                    <div id="featuredKaryaWrap" class="featured-karya-hero" onclick="bukaLightbox(featuredKaryaUrl, featuredKaryaTitle)">
                        <img id="featuredKaryaImg" src="" alt="Karya Utama">
                        <div class="featured-karya-caption">
                            <div>
                                <span class="featured-karya-badge">Karya Pilihan Utama</span>
                                <h3 id="featuredKaryaTitleEl" class="featured-karya-title">Koleksi Karya Studio</h3>
                            </div>
                            <span class="featured-zoom-pill">&#128269; Klik Layar Penuh</span>
                        </div>
                    </div>

                    <!-- GRID FOTO KARYA LAINNYA DI BAWAH FOTO BESAR -->
                    <div id="amGalleryGrid" class="gal-grid"></div>

                    <div style="text-align: center; margin-top: 28px;">
                        <button type="button" class="am-nav-book-btn" onclick="goToBookPage(2)" style="padding: 13px 28px; font-size: 13.5px;">
                            Lihat Daftar Layanan &amp; Paket &rarr;
                        </button>
                    </div>
                </div>
            </section>

            <!-- HALAMAN 3 (BAB II): DAFTAR LAYANAN -->
            <section class="page">
                <div class="page-in">
                    <div class="page-head">
                        <span class="chapter">Bab II</span>
                        <h2 class="title">Daftar <em>Layanan</em></h2>
                    </div>
                    <div id="amServicesGrid" class="svc-grid"></div>
                </div>
            </section>

            <!-- HALAMAN 4 (BAB III): KONTAK & PENUTUP -->
            <section class="page">
                <div class="page-in">
                    <div class="page-head">
                        <span class="chapter">Bab III</span>
                        <h2 class="title">Mari <em>Berjumpa</em></h2>
                    </div>
                    <div class="closing-card">
                        <div class="thanks">Terima Kasih</div>
                        <div class="b-brand js-nama-brand"></div>
                        <p id="closingTaglineEl" class="b-tagline" style="display: none;"></p>
                        <div class="branch-badges-wrap js-block-cabang" style="display: none;"></div>
                        <div class="social-buttons js-block-sosmed" style="display: none;"></div>
                        <button type="button" class="am-nav-book-btn" onclick="bukaFormBooking('', '')" style="padding: 14px 30px; font-size: 14px; margin-top: 8px;">
                            Isi Form Booking Online Sekarang &rarr;
                        </button>
                    </div>
                </div>
            </section>

        </div>

        <!-- INDIKATOR TITIK 4 HALAMAN & PETUNJUK GESER -->
        <div class="dots" id="amDots">
            <button class="dot on" onclick="goToBookPage(0)" aria-label="Sampul"></button>
            <button class="dot" onclick="goToBookPage(1)" aria-label="Galeri Karya"></button>
            <button class="dot" onclick="goToBookPage(2)" aria-label="Layanan"></button>
            <button class="dot" onclick="goToBookPage(3)" aria-label="Kontak"></button>
        </div>
        <div class="hint" id="amHint" onclick="goToBookPage(bookIdx + 1)">Geser &rarr;</div>
    </div>

    <!-- MODAL LIGHTBOX FULLSCREEN HD -->
    <div id="lightboxModal" class="lightbox-modal" onclick="tutupLightbox()">
        <button type="button" class="lightbox-close" onclick="tutupLightbox()">&#10005; Tutup</button>
        <img id="lightboxImg" class="lightbox-img" src="" alt="Preview Layar Penuh" onclick="event.stopPropagation()">
        <div id="lightboxCaption" class="lightbox-caption"></div>
    </div>

<script type="module">
    import { collection, getDocs, getDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { db } from '/firebase-config.js'; 

    // =========================================================================
    // 1. NAVIGASI BUKU GESER SAMPING 5 BAB (T-AMOUR)
    // =========================================================================
    const bookEl = document.getElementById('amourBookContainer');
    const bookPages = Array.from(bookEl.querySelectorAll('.page'));
    const bookDots = Array.from(document.querySelectorAll('#amDots .dot'));
    const bookNavLinks = Array.from(document.querySelectorAll('.am-nav-link'));
    const amHint = document.getElementById('amHint');
    window.bookIdx = 0;
    let wheelLock = false;
    let wheelTimer = null;

    function setBookActive(i) {
        i = Math.max(0, Math.min(bookPages.length - 1, i));
        window.bookIdx = i;
        bookPages.forEach((p, n) => p.classList.toggle('active', n === i));
        bookDots.forEach((d, n) => d.classList.toggle('on', n === i));
        bookNavLinks.forEach((l, n) => l.classList.toggle('active', n === i));
        if (amHint) amHint.classList.toggle('hide', i >= bookPages.length - 1);
    }

    window.goToBookPage = function(i) {
        i = Math.max(0, Math.min(bookPages.length - 1, i));
        bookPages[i].scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
        setBookActive(i);
    };

    bookEl.addEventListener('wheel', function(e) {
        if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
            e.preventDefault();
            if (wheelLock) {
                clearTimeout(wheelTimer);
                wheelTimer = setTimeout(() => { wheelLock = false; }, 180);
                return;
            }
            if (Math.abs(e.deltaX) < 12) return;
            wheelLock = true;
            window.goToBookPage(window.bookIdx + (e.deltaX > 0 ? 1 : -1));
            clearTimeout(wheelTimer);
            wheelTimer = setTimeout(() => { wheelLock = false; }, 600);
        }
    }, { passive: false });

    let bookRaf = false;
    bookEl.addEventListener('scroll', function() {
        if (bookRaf) return;
        bookRaf = true;
        requestAnimationFrame(() => {
            bookRaf = false;
            const w = bookEl.clientWidth || window.innerWidth;
            setBookActive(Math.round(bookEl.scrollLeft / w));
        });
    }, { passive: true });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') tutupLightbox();
        if (e.key === 'ArrowRight') window.goToBookPage(window.bookIdx + 1);
        if (e.key === 'ArrowLeft') window.goToBookPage(window.bookIdx - 1);
    });

    // =========================================================================
    // 2. MUAT DATA PROFIL, 10 FOTO GALERI + JUDUL KARYA, & KATALOG PAKET
    // =========================================================================
    const urlParams = new URLSearchParams(window.location.search);
    let idParam = urlParams.get('id') || urlParams.get('studio');
    if (!idParam) {
        const cleanPath = window.location.pathname.replace(/^\/+|\/+$/g, '');
        if (cleanPath && cleanPath !== 'profil.html' && cleanPath !== 'index.html' && !cleanPath.includes('/')) {
            idParam = decodeURIComponent(cleanPath);
        }
    }
    const temaOverride = urlParams.get('tema');
    if (temaOverride && ['MODERN_STUDIO', 'LUXURY_GOLD', 'CLEAN_MINIMALIST'].includes(temaOverride)) {
        document.body.setAttribute('data-theme', temaOverride);
    }

    let ownerUid = null;
    window.featuredKaryaUrl = "";
    window.featuredKaryaTitle = "";
    let listKaryaItems = [];

    const DEFAULT_PHOTOS = [
        { url: "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1600&q=90", judul: "Background Sampul Utama" },
        { url: "https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=1600&q=90", judul: "The Wedding of Kak Meila" },
        { url: "https://images.unsplash.com/photo-1537633552985-df8429e8048b?auto=format&fit=crop&w=1600&q=90", judul: "Engagement Session Kak Aulia" },
        { url: "https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&fit=crop&w=1600&q=90", judul: "Exclusive Bridal Portrait" }
    ];

    cariDanMuatDataProfil(idParam || '');

    async function cariDanMuatDataProfil(TargetId) {
        try {
            let matchedDoc = null;
            const trimmedTarget = (TargetId || '').trim();

            if (trimmedTarget) {
                const q = query(collection(db, "owners"), where("username", "==", trimmedTarget));
                const querySnapshot = await getDocs(q);
                if (!querySnapshot.empty) {
                    matchedDoc = querySnapshot.docs[0];
                } else {
                    const docSnap = await getDoc(doc(db, "owners", trimmedTarget));
                    if (docSnap.exists()) matchedDoc = docSnap;
                }
            }

            if (!matchedDoc) {
                const allOwnersSnap = await getDocs(collection(db, "owners"));
                if (!allOwnersSnap.empty) {
                    const cleanSlug = trimmedTarget.toLowerCase().replace(/[^a-z0-9]/g, '');
                    for (const dSnap of allOwnersSnap.docs) {
                        const d = dSnap.data() || {};
                        const uSlug = String(d.username || '').toLowerCase().replace(/[^a-z0-9]/g, '');
                        const bSlug = String(d.namaBrand || '').toLowerCase().replace(/[^a-z0-9]/g, '');
                        if ((cleanSlug && (uSlug === cleanSlug || bSlug === cleanSlug)) || dSnap.id.toLowerCase() === trimmedTarget.toLowerCase()) {
                            matchedDoc = dSnap;
                            break;
                        }
                    }
                    if (!matchedDoc) matchedDoc = allOwnersSnap.docs[0];
                }
            }

            if (matchedDoc) {
                ownerUid = matchedDoc.id;
                const data = matchedDoc.data();
                if (!idParam) idParam = data.username || ownerUid;

                // Gunakan portofolioWeb langsung dari dokumen owners/{uid}, fallback ke galeri_web hanya jika kosong
                const hasDirectPhotos = Array.isArray(data.portofolioWeb) && data.portofolioWeb.some(u => u && String(u).trim() !== "");
                if (!hasDirectPhotos) {
                    try {
                        const galeriSnap = await getDocs(collection(db, "owners", ownerUid, "galeri_web"));
                        if (!galeriSnap.empty) {
                            const highRes = [];
                            galeriSnap.forEach((gDoc) => {
                                const gData = gDoc.data() || {};
                                if (gData.url && String(gData.url).trim() !== "") {
                                    highRes.push({
                                        urutan: Number(gData.urutan) || 0,
                                        url: String(gData.url),
                                        judul: String(gData.judul || gData.caption || "")
                                    });
                                }
                            });
                            highRes.sort((a, b) => a.urutan - b.urutan);
                            if (highRes.length > 0) {
                                data.portofolioWeb = highRes.slice(0, 8).map(x => x.url);
                                data.portofolioCaptions = highRes.slice(0, 8).map(x => x.judul);
                            }
                        }
                    } catch (eGaleri) {
                        console.warn("Sub-koleksi galeri_web dilewati:", eGaleri);
                    }
                }

                renderDataOwner(data);
                if (ownerUid) await muatKatalogPaket(ownerUid);
            }
        } catch (error) {
            console.error("Error muat data:", error);
        }
    }

    function renderDataOwner(data) {
        const temaAktif = temaOverride || data.temaWeb || 'MODERN_STUDIO';
        if (['MODERN_STUDIO', 'LUXURY_GOLD', 'CLEAN_MINIMALIST'].includes(temaAktif)) {
            document.body.setAttribute('data-theme', temaAktif);
        }

        const nama = (data.namaBrand || data.namaOwner || "").trim();
        const jenisUsaha = (data.jenisUsaha || "").trim();
        const tagline = (data.taglineWeb || "").trim();
        const bio = (data.bioWeb || "").trim();

        document.title = nama ? `${nama} — Portofolio & Katalog Layanan` : "Portofolio & Katalog Layanan";
        document.querySelectorAll('.js-nama-brand').forEach(el => el.innerText = nama);

        const coverJenisEl = document.getElementById('coverJenisEl');
        if (coverJenisEl) {
            if (jenisUsaha !== "") {
                coverJenisEl.innerText = jenisUsaha;
                coverJenisEl.style.display = 'block';
            } else {
                coverJenisEl.style.display = 'none';
            }
        }

        const coverTaglineEl = document.getElementById('coverTaglineEl');
        if (coverTaglineEl) {
            if (tagline !== "") {
                coverTaglineEl.innerText = `"${tagline}"`;
                coverTaglineEl.style.display = 'block';
            } else {
                coverTaglineEl.style.display = 'none';
            }
        }

        const coverBioEl = document.getElementById('coverBioEl');
        if (coverBioEl) {
            if (bio !== "") {
                coverBioEl.innerText = bio;
                coverBioEl.style.display = 'block';
            } else {
                coverBioEl.style.display = 'none';
            }
        }

        const closingTaglineEl = document.getElementById('closingTaglineEl');
        if (closingTaglineEl) {
            const closingText = bio || tagline;
            if (closingText !== "") {
                closingTaglineEl.innerText = closingText;
                closingTaglineEl.style.display = 'block';
            } else {
                closingTaglineEl.style.display = 'none';
            }
        }

        // Logo Brand (Default otomatis ke Logo Resmi /logo-kafela.svg jika belum diganti)
        const resolvedLogo = (data.logoBrandUrl && data.logoBrandUrl.trim() !== "")
            ? data.logoBrandUrl
            : '/logo-kafela.svg';

        const amLogo = document.getElementById('amLogoImg');
        if (amLogo) {
            amLogo.src = resolvedLogo;
            amLogo.style.display = 'block';
        }
        const coverLogo = document.getElementById('coverLogoImg');
        if (coverLogo) {
            coverLogo.src = resolvedLogo;
        }

        // Alamat / Cabang
        const listLokasi = [data.lokasi1, data.lokasi2, data.lokasi3].filter(l => l && l.trim() !== "");
        if (listLokasi.length > 0) {
            const htmlLokasi = listLokasi.map(lok => {
                const lokAman = lok.replace(/'/g, "\\'");
                return `<button type="button" class="address-badge" onclick="bukaFormLokasi('${lokAman}')"><span>📍</span> <span>${lok}</span></button>`;
            }).join('');
            document.querySelectorAll('.js-block-cabang').forEach(el => {
                el.style.display = 'flex';
                el.innerHTML = htmlLokasi;
            });
        }

        // Media Sosial dengan Logo SVG Resmi Instagram & TikTok (Tampil di Halaman Awal & Halaman Kontak)
        const svgIg = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>`;
        const svgTiktok = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>`;

        let htmlSosmed = "";
        if (data.linkIg && data.linkIg.trim() !== "") {
            let urlIg = data.linkIg.trim();
            if (!urlIg.startsWith('http')) urlIg = 'https://instagram.com/' + urlIg.replace('@', '');
            htmlSosmed += `<a href="${urlIg}" target="_blank" rel="noopener noreferrer" class="social-btn btn-ig">${svgIg} <span>Instagram</span></a>`;
        }
        if (data.linkTiktok && data.linkTiktok.trim() !== "") {
            let urlTiktok = data.linkTiktok.trim();
            if (!urlTiktok.startsWith('http')) urlTiktok = 'https://tiktok.com/@' + urlTiktok.replace('@', '');
            htmlSosmed += `<a href="${urlTiktok}" target="_blank" rel="noopener noreferrer" class="social-btn btn-tiktok">${svgTiktok} <span>TikTok</span></a>`;
        }
        if (htmlSosmed !== "") {
            document.querySelectorAll('.js-block-sosmed').forEach(el => {
                el.style.display = 'flex';
                el.innerHTML = htmlSosmed;
            });
        }

        // =====================================================================
        // ATURAN FOTO:
        // - FOTO 1 (Index 0) -> Khusus Background Sampul Utama (#amCoverBg)
        // - FOTO 2 s/d FOTO 10 (Index 1..9) -> Hanya Tampil di Halaman Karya (Bab III)
        //   dengan 1 Foto Besar di Atasnya + Grid Foto Bernama di Bawahnya!
        // =====================================================================
        const rawPhotos = Array.isArray(data.portofolioWeb) ? data.portofolioWeb : [];
        const rawCaptions = Array.isArray(data.portofolioCaptions) ? data.portofolioCaptions : [];

        const validItems = [];
        for (let i = 0; i < rawPhotos.length; i++) {
            const u = (rawPhotos[i] || "").trim();
            if (u !== "") {
                validItems.push({
                    url: u,
                    judul: (rawCaptions[i] || "").trim()
                });
            }
        }

        const sourceItems = validItems.length > 0 ? validItems : DEFAULT_PHOTOS;

        // 1. Foto 1 khusus Background Sampul Depan
        document.getElementById('amCoverBg').src = sourceItems[0].url;

        // 2. Foto untuk Halaman Karya (Bab III): Ambil Foto 2 s/d 10 (atau Foto 1 jika baru upload 1 foto)
        const karyaItems = sourceItems.length > 1 ? sourceItems.slice(1) : sourceItems;
        listKaryaItems = karyaItems.map((item, idx) => ({
            url: item.url,
            judul: item.judul || `Karya Pilihan ${String(idx + 1).padStart(2, '0')}`,
            kategori: jenisUsaha
        }));

        pilihKaryaUtama(0);
    }

    window.pilihKaryaUtama = function(activeIdx) {
        if (!listKaryaItems || listKaryaItems.length === 0) return;
        const chosen = listKaryaItems[activeIdx] || listKaryaItems[0];
        window.featuredKaryaUrl = chosen.url;
        window.featuredKaryaTitle = chosen.judul;

        // Set 1 Foto Besar di Atas Halaman Karya
        document.getElementById('featuredKaryaImg').src = chosen.url;
        document.getElementById('featuredKaryaTitleEl').innerText = chosen.judul;

        // Render Grid Foto di Bawahnya
        const amGal = document.getElementById('amGalleryGrid');
        amGal.innerHTML = listKaryaItems.map((item, idx) => {
            const isActive = idx === activeIdx ? 'active-thumb' : '';
            const safeTitle = item.judul.replace(/'/g, "\\'").replace(/"/g, '&quot;');
            return `
                <figure class="gal ${isActive}" onclick="klikItemGaleri(${idx}, '${item.url}', '${safeTitle}')">
                    <img src="${item.url}" alt="${safeTitle}">
                    <figcaption>
                        <div class="g-name">${item.judul}</div>
                        <div class="g-tag">0${idx + 1}</div>
                    </figcaption>
                </figure>
            `;
        }).join('');
    };

    window.klikItemGaleri = function(idx, url, title) {
        window.pilihKaryaUtama(idx);
        window.bukaLightbox(url, title);
    };

    async function muatKatalogPaket(uid) {
        const amGrid = document.getElementById('amServicesGrid');
        try {
            const paketSnap = await getDocs(collection(db, "owners", uid, "paket_layanan"));
            if (paketSnap.empty) {
                amGrid.innerHTML = `<p style="text-align:center; color: var(--am-muted); grid-column: 1/-1; padding: 32px;">Silakan klik tombol Booking Online untuk konsultasi paket layanan langsung.</p>`;
                return;
            }

            let listPaket = [];
            paketSnap.forEach(d => listPaket.push(d.data()));
            listPaket.sort((a, b) => (a.urutan || 0) - (b.urutan || 0));

            let htmlAmour = "";
            listPaket.forEach((p, idx) => {
                const noUrut = String(idx + 1).padStart(2, '0');
                const harga = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(p.hargaPaket || 0);
                const desc = p.deskripsiPaket || 'Layanan dokumentasi profesional.';
                const namaAman = (p.namaPaket || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const descAman = (p.deskripsiPaket || '').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n');

                htmlAmour += `
                    <div class="svc-item">
                        <div>
                            <div class="svc-no">${noUrut}</div>
                            <div class="svc-name">${p.namaPaket}</div>
                            <div class="svc-price">${harga}</div>
                            <div class="svc-desc">${desc}</div>
                        </div>
                        <button type="button" class="svc-btn" onclick="bukaFormBooking('${namaAman}', '${descAman}')">Pilih Paket &amp; Booking &rarr;</button>
                    </div>
                `;
            });

            amGrid.innerHTML = htmlAmour;
        } catch (e) {
            console.error(e);
        }
    }

    window.bukaLightbox = function(url, captionText) {
        document.getElementById('lightboxImg').src = url;
        document.getElementById('lightboxCaption').innerText = captionText || '';
        document.getElementById('lightboxModal').classList.add('open');
    };
    window.tutupLightbox = function() {
        document.getElementById('lightboxModal').classList.remove('open');
    };

    window.bukaFormBooking = function(namaPaket, deskripsiPaket) {
        let url = `/booking.html?id=${encodeURIComponent(idParam)}`;
        if (temaOverride) url += `&tema=${encodeURIComponent(temaOverride)}`;
        if (namaPaket) url += `&paket=${encodeURIComponent(namaPaket)}`;
        if (deskripsiPaket) url += `&desc=${encodeURIComponent(deskripsiPaket)}`;
        window.location.href = url;
    };

    window.bukaFormLokasi = function(namaLokasi) {
        let url = `/booking.html?id=${encodeURIComponent(idParam)}&lokasi=${encodeURIComponent(namaLokasi)}`;
        if (temaOverride) url += `&tema=${encodeURIComponent(temaOverride)}`;
        window.location.href = url;
    };
</script>

</body>
</html>
